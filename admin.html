<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Painel privado</title>
<style>
:root{--night:#170410;--rose:#e8a0b4;--blush:#f7d9e0;--gold:#e6c07b;--line:rgba(230,192,123,.28)}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:Georgia,serif;background:var(--night);color:#fff4ef;min-height:100vh;padding:20px}
.wrap{max-width:820px;margin:0 auto}
h1{font-weight:400;color:var(--blush);font-size:28px;margin-bottom:4px}
.muted{opacity:.7;font-size:15px}
input,button{font:inherit;padding:10px 14px;border-radius:8px;border:1px solid var(--line);background:rgba(255,255,255,.06);color:inherit}
button{cursor:pointer;background:var(--rose);color:#2a0716;border:0;font-weight:600}
button.ghost{background:none;color:inherit;border:1px solid var(--line)}
#login{max-width:340px;margin:12vh auto;display:grid;gap:10px}
#panel,#msg{display:none}
.top{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:18px;flex-wrap:wrap}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-bottom:18px}
.c{border:1px solid var(--line);border-radius:10px;padding:12px 14px;background:rgba(255,255,255,.04)}
.c b{display:block;font-size:26px;color:var(--gold)}
.c.sim{background:rgba(230,80,120,.25);border-color:var(--rose)}
#alerta{display:none;padding:14px;border-radius:10px;background:var(--rose);color:#2a0716;font-size:20px;text-align:center;margin-bottom:14px}
h2{font-weight:400;font-size:20px;color:var(--blush);margin:18px 0 8px}
.tags{display:flex;flex-wrap:wrap;gap:6px}
.tags span{border:1px solid var(--line);border-radius:99px;padding:3px 12px;font-size:15px}
ul{list-style:none;border-top:1px solid var(--line)}
li{display:flex;gap:12px;padding:9px 2px;border-bottom:1px solid var(--line);font-size:16px}
li time{opacity:.6;min-width:120px;font-size:14px;padding-top:1px}
li.sim{color:var(--rose);font-weight:700}
#msg{padding:14px;border:1px solid var(--line);border-radius:10px;margin-top:20px;line-height:1.5}
</style>
</head>
<body>
<div class="wrap">

  <form id="login">
    <h1>Painel privado</h1>
    <input id="pw" type="password" placeholder="Senha do painel" autocomplete="current-password" required>
    <button type="submit">Entrar</button>
    <p class="muted" id="err"></p>
  </form>

  <div id="panel">
    <div class="top">
      <div><h1>O que ela fez no site</h1><p class="muted">Atualiza sozinho a cada 10 segundos</p></div>
      <button class="ghost" id="out">Sair</button>
    </div>
    <div id="alerta"></div>
    <div class="cards" id="cards"></div>
    <h2>Fotos que ela viu</h2><div class="tags" id="fotos"></div>
    <h2>Cada vez que ela entrou</h2><ul id="visitas"></ul>
    <h2>Linha do tempo</h2><ul id="lista"></ul>
  </div>

  <div id="msg"></div>
</div>

<script type="module">
import { URL_SCRIPT, configurado } from './config.js';
const $ = s => document.querySelector(s);
const msg = t => { $('#msg').style.display = t ? 'block' : 'none'; $('#msg').innerHTML = t || ''; };

if (!configurado) {
  $('#login').style.display = 'none';
  msg('O painel ainda não foi configurado. Siga o passo a passo do arquivo <b>LEIA-ME-ADMIN.md</b> e cole a URL em <b>config.js</b>.');
} else {
  const nomes = {
    visita: 'Abriu o site', abriu_carta: 'Abriu a cartinha', aba: 'Entrou na aba', foto: 'Abriu a foto',
    memoria_inicio: 'Começou o jogo da memória', memoria_completa: 'Terminou o jogo da memória',
    musica_play: 'Tocou a música', musica_pause: 'Pausou a música', nao: 'Tentou clicar em "Não" 😂',
    sim: 'RESPONDEU SIM 💗💗💗', saiu: 'Saiu / minimizou o site', voltou: 'Voltou pro site', compartilhou: 'COMPARTILHOU o site 💌', compartilhar_cancelou: 'Abriu o compartilhar mas cancelou',
    memoria_jogou: 'Começou a jogar a memória', carta_lida: 'Leu a carta até o fim', foto_vista: 'Viu na galeria'
  };

  let pw = sessionStorage.getItem('pw') || '', timer = null, simAntes = null;
  function mostrar(logado, erro = '') {
    $('#login').style.display = logado ? 'none' : 'grid';
    $('#panel').style.display = logado ? 'block' : 'none';
    $('#err').textContent = erro;
  }
  function sair(erro = '') { sessionStorage.removeItem('pw'); pw = ''; clearInterval(timer); simAntes = null; mostrar(false, erro); }
  async function carregar() {
    try {
      const j = await (await fetch(URL_SCRIPT + '?key=' + encodeURIComponent(pw))).json();
      if (j.erro) { sair('Senha incorreta.'); return false; }
      const ev = j.ev.map(e => ({ ...e, t: new Date(e.ts) })).sort((a, b) => b.t - a.t);
      msg(''); render(ev);
      const sims = ev.filter(e => e.type === 'sim').length;
      if (simAntes !== null && sims > simAntes) {
        $('#alerta').style.display = 'block'; $('#alerta').textContent = '💗 ELA DISSE SIM! 💗';
        if (Notification.permission === 'granted') new Notification('Ela disse SIM! 💗');
      }
      simAntes = sims; return true;
    } catch { msg('Não consegui falar com o Google. Confira a URL em <b>config.js</b> e se a implantação está com acesso "Qualquer pessoa".'); return false; }
  }
  async function entrar() {
    if (!(await carregar())) return;
    mostrar(true);
    if ('Notification' in window && Notification.permission === 'default') Notification.requestPermission();
    clearInterval(timer); timer = setInterval(() => { if (!document.hidden) carregar(); }, 10000);
  }
  $('#login').addEventListener('submit', e => { e.preventDefault(); pw = $('#pw').value; sessionStorage.setItem('pw', pw); entrar(); });
  $('#out').onclick = () => sair();
  if (pw) entrar();

  function render(ev) {
    const H = {day:'2-digit',month:'2-digit',hour:'2-digit',minute:'2-digit'};
    const fmt = d => d.toLocaleString('pt-BR', H);
    const cnt = t => ev.filter(e => e.type === t).length;
    const sids = [...new Set(ev.map(e => e.sid))];
    const min = Math.round(cnt('ativo') * 0.5);
    const vistas = new Set(ev.filter(e => e.type === 'foto_vista').map(e => e.detail));
    const abertas = new Set(ev.filter(e => e.type === 'foto').map(e => e.detail));
    const todas = [...new Set([...vistas, ...abertas])].sort((x, y) => parseInt(x.slice(5)) - parseInt(y.slice(5)));
    const sim = cnt('sim'), comp = cnt('compartilhou');
    const ultima = ev.length ? fmt(ev[0].t) : '—';
    const yn = (n, s, nao) => n ? s : nao;
    $('#cards').innerHTML = [
      [sim ? 'sim' : '', sim ? 'SIM 💗' : 'ainda não', 'resposta ao pedido'],
      ['', sids.length, 'vezes que entrou'],
      ['', min + ' min', 'tempo total no site'],
      ['', todas.length + '/22', 'fotos vistas (' + abertas.size + ' ampliadas)'],
      ['', yn(cnt('memoria_jogou'), 'sim', 'não'), 'jogou a memória (' + cnt('memoria_completa') + ' completos)'],
      ['', yn(cnt('carta_lida'), 'sim', 'não'), 'leu a carta até o fim'],
      ['', cnt('nao'), 'tentativas no "Não"'],
      ['', cnt('musica_play'), 'vezes que tocou a música'],
      ['', ultima, 'última atividade']
    ].map(([c, v, l]) => `<div class="c ${c}"><b>${v}</b>${l}</div>`).join('');
    $('#fotos').innerHTML = todas.length
      ? todas.map(f => `<span>${f}${abertas.has(f) ? ' 🔍' : ''}</span>`).join('') : '<span class="muted">nenhuma ainda</span>';
    $('#visitas').innerHTML = sids.map(id => {
      const v = ev.filter(e => e.sid === id), t = v.map(e => e.t);
      const m = Math.max(1, Math.round(v.filter(e => e.type === 'ativo').length * 0.5));
      const acoes = v.filter(e => !['ativo', 'saiu', 'voltou', 'visita'].includes(e.type)).length;
      const sn = v.some(e => e.type === 'sim') ? ' · disse SIM 💗' : '';
      return `<li><time>${fmt(new Date(Math.min(...t)))}</time><span>~${m} min · ${acoes} ações${sn}</span></li>`;
    }).join('') || '<li class="muted">Ninguém entrou ainda.</li>';
    $('#lista').innerHTML = ev.filter(e => !['ativo', 'foto_vista'].includes(e.type)).map(e =>
      `<li class="${e.type}"><time>${e.t.toLocaleString('pt-BR', {...H, second: '2-digit'})}</time>` +
      `<span>${nomes[e.type] || e.type}${e.detail ? ': ' + e.detail.replace(/</g, '&lt;') : ''}</span></li>`).join('') || '<li class="muted">Nada ainda. Assim que ela abrir o site, aparece aqui.</li>';
  }
}
</script>
</body>
</html>
